name: ICTU
services:
  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    expose: ["8080"]
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp", "/var/run/apache2:uid=33,gid=33,mode=755", "/var/lock/apache2:uid=33,gid=33,mode=755"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["8080:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [frontend, observability]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes: ["mysql_data:/var/lib/mysql", "./mysql/init:/docker-entrypoint-initdb.d:ro"]
    networks: [backend, monitoring]
    expose: ["3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    profiles: ["tools"]
    restart: unless-stopped
    environment: {PMA_HOST: db, PMA_PORT: "3306", UPLOAD_LIMIT: 16M}
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8081:80"]
    networks: [backend]
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus_data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [monitoring, observability]
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["grafana_data:/var/lib/grafana", "./grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["127.0.0.1:3000:3000"]
    networks: [monitoring, observability]
    depends_on: [prometheus, loki]
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    command: ["--docker_only=true"]
    volumes: ["/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker/:/var/lib/docker:ro", "/dev/disk/:/dev/disk:ro"]
    networks: [monitoring]
    expose: ["8080"]
  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped
    command: ["--mysqld.address=db:3306", "--mysqld.username=exporter"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    networks: [backend, monitoring]
    expose: ["9104"]
    depends_on:
      db:
        condition: service_healthy
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    networks: [frontend, monitoring]
    expose: ["9113"]
    depends_on: [nginx]
  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes: ["./loki/config.yml:/etc/loki/config.yml:ro", "loki_data:/loki"]
    ports: ["127.0.0.1:3100:3100"]
    networks: [observability]
  promtail:
    image: grafana/promtail:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes: ["./promtail/config.yml:/etc/promtail/config.yml:ro", "/var/lib/docker/containers:/var/lib/docker/containers:ro", "/var/run/docker.sock:/var/run/docker.sock:ro", "promtail_positions:/tmp"]
    networks: [observability]
    depends_on: [loki]
volumes:
  mysql_data: {}
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
  promtail_positions: {}
networks:
  frontend: {}
  backend: {internal: true}
  monitoring: {internal: true}
  observability: {}
